<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Таблица 19×6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .btn {
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-46 { background: #ff7a45; }  /* оранжевый */
  .btn-38 { background: #3b82f6; }  /* синий */
  .btn-30 { background: #22c55e; }  /* зелёный */
  .btn.active {
    box-shadow: 0 0 25px 5px currentColor;
    transform: scale(1.05);
  }
  #info {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info">🖱 Перетащи, чтобы вращать • Колёсико — зум</div>
<div id="ui">
  <button class="btn btn-46" data-sector="46">46 — внешний</button>
  <button class="btn btn-38" data-sector="38">38 — средний</button>
  <button class="btn btn-30" data-sector="30">30 — внутренний</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ====== РАЗМЕРЫ ======
const ROWS = 19;
const COLS = 6;
const CELL = 1;         // размер клетки
const GAP  = 0.05;      // зазор между клетками
const STEP = CELL + GAP;

// ====== ЦВЕТА ======
const COLOR_BASE    = 0xf0f0f0; // обычная клетка
const COLOR_46      = 0xff7a45; // оранжевый
const COLOR_38      = 0x3b82f6; // синий
const COLOR_30      = 0x22c55e; // зелёный

// ====== СЦЕНА ======
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 0, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12;
controls.maxDistance = 80;

// ====== СВЕТ ======
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.2);
dir1.position.set(5, 10, 10);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
dir2.position.set(-10, -5, -10);
scene.add(dir2);

// ====== ГРУППА ТАБЛИЦЫ ======
const board = new THREE.Group();
// Центрируем таблицу в начале координат
board.position.set(
  -(COLS * STEP) / 2 + STEP / 2,
   (ROWS * STEP) / 2 - STEP / 2,
  0
);
scene.add(board);

// ====== ОПРЕДЕЛЕНИЕ СЕКТОРА ДЛЯ КЛЕТКИ (row, col) ======
// row: 0..18 (сверху вниз), col: 0..5 (слева направо)
// Внешний 46, средний 38, внутренний 30 — как на образце
function getSector(row, col) {
  // Внешнее кольцо (рамка)
  const onBorder =
    row === 0 || row === ROWS - 1 || col === 0 || col === COLS - 1;
  if (onBorder) return 46;

  // Средний слой — второе кольцо
  const onMiddleRing =
    row === 1 || row === ROWS - 2 || col === 1 || col === COLS - 2;
  if (onMiddleRing) return 38;

  // Всё остальное — внутренний сектор
  return 30;
}

// ====== СОЗДАНИЕ КЛЕТОК ======
const cells = [];        // { mesh, sector, baseColor, number }
let cellNumber = 1;

const geometry = new THREE.BoxGeometry(CELL, CELL, 0.3);
const edgeGeo  = new THREE.EdgesGeometry(geometry);

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const sector = getSector(r, c);
    const color  = sector === 46 ? COLOR_46
                 : sector === 38 ? COLOR_38
                 :                 COLOR_30;

    const mat = new THREE.MeshStandardMaterial({
      color: color,
      roughness: 0.55,
      metalness: 0.05,
    });

    const mesh = new THREE.Mesh(geometry, mat);
    mesh.position.set(c * STEP, -r * STEP, 0);

    // Контур клетки
    const edges = new THREE.LineSegments(
      edgeGeo,
      new THREE.LineBasicMaterial({ color: 0x222222 })
    );
    mesh.add(edges);

    // Номер клетки — на передней грани
    const numTexture = makeNumberTexture(cellNumber);
    const numMat = new THREE.MeshBasicMaterial({
      map: numTexture,
      transparent: true,
      depthWrite: false,
    });
    const numMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(CELL * 0.85, CELL * 0.85),
      numMat
    );
    numMesh.position.z = 0.16; // чуть впереди куба
    mesh.add(numMesh);

    board.add(mesh);
    cells.push({ mesh, sector, baseColor: color, number: cellNumber });
    cellNumber++;
  }
}

// ====== ТЕКСТУРА С НОМЕРОМ ======
function makeNumberTexture(num) {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(num, size / 2, size / 2);
  ctx.fillText(num, size / 2, size / 2);

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  return tex;
}

// ====== ПОДСВЕТКА СЕКТОРА ======
let activeSector = null;

function highlightSector(sector) {
  activeSector = (activeSector === sector) ? null : sector;

  cells.forEach(({ mesh, sector: s, baseColor }) => {
    const mat = mesh.material;
    if (activeSector === null) {
      // Сброс — все клетки возвращаются к своим цветам
      mat.color.setHex(baseColor);
      mat.emissive.setHex(0x000000);
      mat.emissiveIntensity = 0;
    } else if (s === activeSector) {
      // Подсветка — ярче и с лёгким свечением
      mat.color.setHex(baseColor);
      mat.emissive.setHex(baseColor);
      mat.emissiveIntensity = 0.9;
    } else {
      // Затемнение остальных
      mat.color.setHex(0x2a2a2a);
      mat.emissive.setHex(0x000000);
      mat.emissiveIntensity = 0;
    }
  });

  // Кнопки
  document.querySelectorAll('.btn').forEach(btn => {
    const s = Number(btn.dataset.sector);
    btn.classList.toggle('active', s === activeSector);
  });
}

// ====== ОБРАБОТКА КНОПОК ======
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    highlightSector(Number(btn.dataset.sector));
  });
});

// ====== АНИМАЦИЯ ======
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ====== АДАПТАЦИЯ ПОД РАЗМЕР ОКНА ======
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
